name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ["3.11", "3.14.10"]
        include:
          - os: ubuntu-24.04
            venv-python: ./.venv/bin/python
          - os: windows-2022
            venv-python: ./.venv/Scripts/python.exe
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Create isolated environment
        run: python -m venv .venv
      - name: Install project in the virtual environment
        run: '& "${{ matrix.venv-python }}" -m pip install -e ".[dev]"'
      - name: Check Python version
        run: '& "${{ matrix.venv-python }}" --version'
      - name: Ruff
        run: '& "${{ matrix.venv-python }}" -m ruff check .'
      - name: Pytest
        run: '& "${{ matrix.venv-python }}" -m pytest -q'
