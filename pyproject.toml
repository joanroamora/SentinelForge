[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelforge"
version = "0.2.0"
description = "Local static security signals and auditable analysis workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
  "rich>=15,<16",
]

[project.optional-dependencies]
dev = [
  "httpx2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
sentinelforge = "sentinelforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinelforge = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
